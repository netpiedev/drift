name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d drift_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DRIFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/drift_test?sslmode=disable
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./cmd/drift

  wrapper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun test

version: 2
project_name: drift

before:
  hooks:
    - go mod tidy

builds:
  - id: drift
    main: ./cmd/drift
    dir: ./core
    binary: drift
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: binaries
    formats: [binary]
    name_template: "{{ .Os }}-{{ .Arch }}-{{ .Binary }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: netpiedev
    name: drift
